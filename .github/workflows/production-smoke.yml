name: Production smoke

on:
  push:
    branches:
      - main
      - diagnose/vercel-origins
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe canonical route and Vercel origins
        shell: bash
        run: |
          set -u
          failures=0

          probe() {
            local name="$1"
            local url="$2"
            local expected_type="$3"
            echo "===== ${name} ====="
            status=$(curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "HTTP ${status}"
            cat /tmp/headers
            echo "--- body preview ---"
            head -c 700 /tmp/body || true
            echo
            if [ "$status" != "200" ]; then
              failures=$((failures+1))
              return
            fi
            if [ "$expected_type" = "json" ]; then
              if ! python -c "import json, pathlib; json.loads(pathlib.Path('/tmp/body').read_text(errors='replace')); print('VALID_JSON')"; then
                failures=$((failures+1))
              fi
            fi
          }

          CANON="https://chrisizworski.com/national-tools/monarch-migration-live"
          K7="https://monarch-migration-live-k7om.vercel.app"
          PLAIN="https://monarch-migration-live.vercel.app"

          probe "canonical page" "$CANON?v=smoke-${GITHUB_SHA}" html
          probe "canonical ping" "$CANON/api/ping?smoke=${GITHUB_SHA}" json
          probe "k7om direct ping" "$K7/api/ping?smoke=${GITHUB_SHA}" json
          probe "plain direct ping" "$PLAIN/api/ping?smoke=${GITHUB_SHA}" json
          probe "plain status" "$PLAIN/api/status?smoke=${GITHUB_SHA}" json
          probe "plain context" "$PLAIN/api/context?lat=43.6&lng=-83.9&smoke=${GITHUB_SHA}" json
          probe "plain geocode" "$PLAIN/api/geocode?zip=48706&smoke=${GITHUB_SHA}" json
          probe "plain sightings" "$PLAIN/api/sightings?days=3&limit=5&smoke=${GITHUB_SHA}" json
          probe "plain history" "$PLAIN/api/history?lat=43.6&lng=-83.9&radius=1&smoke=${GITHUB_SHA}" json

          echo "Failures: $failures"
          test "$failures" -eq 0
