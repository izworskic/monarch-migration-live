name: Production smoke

on:
  push:
    branches:
      - main
      - fix/production-routing-architecture
      - fix/api-local-runtime
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe canonical page and APIs
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://chrisizworski.com/national-tools/monarch-migration-live"

          probe() {
            local name="$1"
            local url="$2"
            local expected_type="$3"
            echo "===== ${name} ====="
            status=$(curl -sS -L --max-time 30 -D /tmp/headers -o /tmp/body -w '%{http_code}' "$url" || true)
            echo "HTTP ${status}"
            cat /tmp/headers
            echo "--- body preview ---"
            head -c 500 /tmp/body || true
            echo
            test "$status" = "200"
            if [ "$expected_type" = "json" ]; then
              python -c "import json, pathlib; json.loads(pathlib.Path('/tmp/body').read_text(errors='replace')); print('VALID_JSON')"
            fi
          }

          probe "page" "$BASE?v=smoke-${GITHUB_SHA}" html
          probe "app.js" "$BASE/app.js?v=smoke-${GITHUB_SHA}" js
          probe "ping api" "$BASE/api/ping?smoke=${GITHUB_SHA}" json
          probe "status api" "$BASE/api/status?smoke=${GITHUB_SHA}" json
          probe "context api" "$BASE/api/context?lat=43.6&lng=-83.9&smoke=${GITHUB_SHA}" json
          probe "geocode api" "$BASE/api/geocode?zip=48706&smoke=${GITHUB_SHA}" json
